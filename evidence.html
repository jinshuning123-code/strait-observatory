<!doctype html><html lang="zh-CN"><head><script src="public-data/catalog.js"></script><script src="public-site.js"></script><link rel="stylesheet" href="public-site.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原始报告 · 海峡观察</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css"><style>.evidence-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px}.source-option{width:100%;padding:13px;text-align:left;border:0;border-bottom:1px solid #e4eaec;background:white;line-height:1.7}.source-option[aria-pressed=true]{background:#e6f1f0;color:#147d81}.source-option small{display:block;color:#71808b}#source-list{max-height:650px;overflow:auto}#pdf-preview{width:100%;height:auto;display:block;border:1px solid #dce3e6}#page-text{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 monospace;max-height:400px;overflow:auto}.reader-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0}.reader-tools button,.reader-tools input{padding:9px;border:1px solid #d6dfe1;border-radius:6px;background:white}.reader-tools input{width:76px}#source-meta{overflow-wrap:anywhere;line-height:1.9}#record-links button{display:block;width:100%;text-align:left;padding:12px;border:1px solid #e0e6e8;border-radius:7px;background:white;margin:8px 0}#source-search{width:100%;padding:12px;border:1px solid #d6dfe1;border-radius:7px}@media(max-width:850px){.evidence-layout{grid-template-columns:minmax(0,1fr)}#source-list{max-height:240px}}</style><link rel="stylesheet" href="interface.css?v=20261101-ui"></head><body class="dashboard"><script src="ui-language.js?v=20261101-ui"></script><header class="dash-header"><a href="dashboard.html">← 工作台</a><strong>原始报告</strong><a href="quality.html">待核对记录</a></header><main class="dash-main"><h1>打开报告，找到原来那一页</h1><section class="page-guide" aria-label="本页操作说明"><p>每份报告都可以从事件记录回查到具体页面。</p><ol><li><span>1</span>在左边选报告</li><li><span>2</span>输入页码或翻页</li><li><span>3</span>对照原文和图表</li></ol></section><p>先在左边选报告，再用页码或上下页按钮阅读。这里显示PDF原页，页码从文件第1页开始算。</p><p id="evidence-stats" class="dash-note"></p><div class="evidence-layout"><aside class="dash-card"><label>查找报告<input id="source-search" placeholder="标题、机构、来源编号"></label><label class="reader-tools"><input id="archived-only" type="checkbox">只看已保存PDF的报告</label><div id="source-list"></div><p><a href="evidence-catalog.json" download>下载报告目录</a></p></aside><div><section class="dash-card"><h2 id="source-title"></h2><div id="source-meta"></div><div id="record-links"></div></section><section class="dash-card" id="reader"><div class="reader-tools"><button id="prev-page">上一页</button><label>PDF页码 <input id="page-number" type="number" min="1"></label><span id="page-total"></span><button id="next-page">下一页</button><a id="original-pdf" target="_blank" rel="noopener">打开原PDF ↗</a></div><p id="page-status" role="status"></p><img id="pdf-preview" alt="原始报告页面预览"><details><summary>查看这一页的文字（图表可能没有完整识别）</summary><pre id="page-text"></pre></details></section></div></div></main><script src="evidence-data.js"></script><script src="evidence.js?v=20261101-ui"></script></body></html>
