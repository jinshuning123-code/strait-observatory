<!doctype html><html lang="zh-CN"><head><script src="public-data/catalog.js"></script><script src="public-site.js"></script><link rel="stylesheet" href="public-site.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI整理事件 · 海峡观察</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css"><style>.answer{white-space:pre-wrap;line-height:1.9;font-size:16px;overflow-wrap:anywhere}form{display:grid;gap:12px}label{display:grid;gap:7px}textarea,input,select{font:inherit;max-width:100%;padding:11px;border:1px solid #d0dade;border-radius:7px}button{padding:12px;border:0;border-radius:7px;background:#147d81;color:white}.history-button{display:block;width:100%;text-align:left;background:white;color:#147d81;border-bottom:1px solid #dce5e7;line-height:1.7}.evidence-note{padding:12px 0;border-bottom:1px solid #e4e8ea;overflow-wrap:anywhere}.review-note{background:#f4f6f7;padding:13px;border-radius:8px;white-space:pre-wrap;line-height:1.8}</style><link rel="stylesheet" href="interface.css?v=20261101-ui"></head><body class="dashboard"><script src="ui-language.js?v=20261101-ui"></script><header class="dash-header"><a href="index.html">← 事件地图</a><strong>AI整理事件</strong><a href="ai.html">AI使用说明</a></header><main class="dash-main"><h1 id="event-title">加载事件…</h1><p id="event-status" role="status"></p><p><a id="reconstruction-link" href="reconstruction-report.html">比较这些材料，生成完整的事件重建报告 →</a></p><div class="dash-grid"><div><section class="dash-card"><h2>1. 先看看AI会参考哪些资料</h2><p>AI会根据下面列出的报告文字回答，最多参考8段资料。可以先展开原文、查看已有回答；点击生成才会调用DeepSeek并计费。</p><div id="event-evidence"></div><form id="event-question"><label>你想了解什么？<textarea id="event-prompt" rows="5">这件事是怎么发生的？几份报告有哪些不同说法？哪些信息能确认，哪些还需要查？请注明来自哪份报告的哪一页。</textarea></label><button id="generate-event">根据这些资料生成分析（计费）</button><p id="generate-status" role="status"></p></form></section><section class="dash-card"><h2>已有的AI回答</h2><p>打开已有回答不会再次计费。以前的回答和后来的修改意见都会保留。</p><div id="event-history"></div></section></div><section class="dash-card"><h2>2. 看回答，再回报告核对</h2><div id="run-meta"></div><div id="run-answer" class="answer">选择一份已有回答，或根据左侧资料生成分析。</div><div id="run-sources"></div><div id="run-reviews"></div><form id="run-review" hidden><label>核对人<input name="reviewer" required></label><label>状态<select name="status"><option>待复核</option><option>需修订</option><option>已复核</option></select></label><label>核对后，你认为哪些地方需要改？<textarea name="note" required rows="4"></textarea></label><label>原说法、改正结果和依据<textarea name="correction" rows="4" placeholder="只记录实际发现的问题，并引用证据编号；没有则留空"></textarea></label><button>保存我的核对意见</button><p id="review-status" role="status"></p></form></section></div></main><script src="event-ai.js?v=20261101-ui"></script></body></html>
